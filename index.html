<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap');

/* Everforest Dark (medium) — see unix-ricing palette reference */
:root{
  --bg-dim:#232a2e; --bg0:#2d353b; --bg1:#343f44; --bg2:#3d484d; --bg3:#475258; --bg4:#4f585e;
  --fg:#d3c6aa; --grey0:#7a8478; --grey1:#859289; --grey2:#9da9a0;
  --red:#e67e80; --orange:#e69875; --yellow:#dbbc7f; --green:#a7c080; --aqua:#83c092; --blue:#7fbbb3;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:6px; --sp:8px; --rowh:28px;
}
*{box-sizing:border-box;margin:0;padding:0}

.rice{
  background:var(--bg-dim); color:var(--fg); font-family:var(--mono);
  font-size:13px; line-height:1.45; min-height:100dvh; padding:10px 10px 40px;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
.shell{max-width:1120px;margin:0 auto}

/* ── waybar-style top bar ─────────────────────────── */
.bar{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin-bottom:10px}
.mod{background:var(--bg1);border:1px solid var(--bg3);border-radius:var(--r);
     padding:6px 11px;display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.mod.brand{background:var(--bg0);border-color:var(--green);color:var(--green);font-weight:700;letter-spacing:.08em}
.mod .k{color:var(--grey1)}
.mod .v{color:var(--fg);font-weight:500}
.mod.right{margin-left:auto}
.mod.warn{border-color:var(--red);color:var(--red)}
.mod.warn .k{color:var(--red)}
.dotg{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dotr{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.dotm{width:7px;height:7px;border-radius:50%;background:var(--grey0);flex:none}

/* ── workspace-style tabs ─────────────────────────── */
.ws{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ws button{font-family:var(--mono);font-size:12px;background:var(--bg1);color:var(--grey2);
  border:1px solid var(--bg3);border-radius:var(--r);padding:6px 12px;cursor:pointer;
  display:flex;gap:7px;align-items:center;transition:none}
.ws button:hover{background:var(--bg2);color:var(--fg)}
.ws button .idx{color:var(--grey0);font-size:11px}
.ws button.on{background:var(--green);border-color:var(--green);color:var(--bg0);font-weight:700}
.ws button.on .idx{color:var(--bg0);opacity:.65}
.ws button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.ws .badge{background:var(--red);color:var(--bg0);border-radius:3px;padding:0 5px;font-size:10px;font-weight:700}
.ws button.on .badge{background:var(--bg0);color:var(--red)}

/* ── panels ───────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.grid.split{grid-template-columns:1.4fr 1fr}}
.panel{background:var(--bg0);border:1px solid var(--bg3);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.ph{display:flex;align-items:center;gap:8px;background:var(--bg1);border-bottom:1px solid var(--bg3);
    padding:6px 11px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--grey1)}
.ph b{color:var(--fg);font-weight:500}
.ph .n{margin-left:auto;color:var(--grey0)}
.ph.acc{border-bottom-color:var(--green)}
.ph.acc b{color:var(--green)}
.pb{padding:0}
.pb.pad{padding:11px}

/* ── THE LIST: fixed columns, one line, no gaps ───── */
.list{display:block}
.r{display:grid;grid-template-columns:30px minmax(0,1fr) 104px 88px;
   align-items:center;column-gap:9px;height:var(--rowh);padding:0 11px;
   border-bottom:1px solid var(--bg1);font-size:12.5px}
.r:last-child{border-bottom:none}
.r:hover{background:var(--bg1)}
.r>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-pos{color:var(--grey0);font-size:10.5px;font-weight:700;letter-spacing:.05em}
.r-pos.QB{color:var(--green)}
.r-pos.RB{color:var(--aqua)}
.r-pos.WR{color:var(--blue)}
.r-pos.TE{color:var(--yellow)}
.r-nm{color:var(--fg);font-weight:500}
.r-tm{color:var(--grey1);font-size:11.5px}
.r-t{color:var(--grey1);font-size:11.5px;text-align:right}
.r-t.live{color:var(--red);font-weight:700}
.r-t.done{color:var(--bg4)}
.r-t.bye{color:var(--orange)}
.r.dim .r-nm{color:var(--grey1)}
@media(max-width:640px){
  .r{grid-template-columns:28px minmax(0,1fr) 74px}
  .r-tm{display:none}
}
.tag{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.06em;
     padding:1px 4px;border-radius:3px;margin-left:6px;vertical-align:1px}
.tag.out{background:var(--red);color:var(--bg0)}
.tag.q{background:var(--yellow);color:var(--bg0)}
.tag.bye{background:var(--orange);color:var(--bg0)}

/* ── tiling-WM bays ───────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;padding:6px}
.tile{background:var(--bg-dim);border:1px solid var(--bg3);border-radius:calc(var(--r) - 2px);overflow:hidden}
.tile-h{background:var(--bg1);padding:3px 8px;font-size:9.5px;letter-spacing:.11em;
        text-transform:uppercase;color:var(--grey1);display:flex;justify-content:space-between;gap:6px}
.tile-b{padding:8px 9px 10px}
.tile-nm{font-size:14px;font-weight:500;color:var(--fg);line-height:1.2;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-s{font-size:10.5px;color:var(--grey0);margin-top:3px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.focus{border-color:var(--green)}
.tile.focus .tile-h{background:var(--green);color:var(--bg0);font-weight:700}
.tile.bad{border-color:var(--red)}
.tile.bad .tile-h{background:var(--red);color:var(--bg0);font-weight:700}
.tile.warn{border-color:var(--yellow)}
.tile.warn .tile-h{background:var(--yellow);color:var(--bg0);font-weight:700}
.tile.open .tile-b{background:repeating-linear-gradient(-45deg,transparent,transparent 5px,var(--bg0) 5px,var(--bg0) 10px)}
.tile.open .tile-nm{color:var(--grey0)}

/* ── alerts ───────────────────────────────────────── */
.al{display:grid;grid-template-columns:20px minmax(0,1fr);gap:9px;padding:9px 11px;
    border-bottom:1px solid var(--bg1);align-items:start}
.al:last-child{border-bottom:none}
.al-s{font-size:11px;font-weight:700;color:var(--red);text-align:center;line-height:1.5}
.al.w .al-s{color:var(--yellow)}
.al.i .al-s{color:var(--aqua)}
.al-t{font-size:12.5px;color:var(--fg);font-weight:500}
.al-d{font-size:11.5px;color:var(--grey1);margin-top:1px}

/* ── stat blocks ──────────────────────────────────── */
.stats{display:grid;grid-template-columns:1fr;gap:1px;background:var(--bg3)}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,1fr)}}
.st{background:var(--bg0);padding:11px 12px 13px}
.st-h{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey0);margin-bottom:5px}
.st-n{font-size:26px;font-weight:700;line-height:1;color:var(--fg);margin-bottom:5px}
.st-n.hot{color:var(--red)} .st-n.good{color:var(--green)} .st-n.mid{color:var(--yellow)}
.st-d{font-size:11.5px;color:var(--grey1);line-height:1.45}

/* ── scoreboard ───────────────────────────────────── */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
       align-items:center;gap:12px;padding:14px 14px}
.sc-nm{font-size:11.5px;color:var(--grey1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-pt{font-size:30px;font-weight:700;line-height:1.05;color:var(--fg)}
.sc-l{text-align:right}
.sc-vs{font-size:10px;color:var(--grey0);letter-spacing:.14em}
.sc-pt.lead{color:var(--green)}

/* ── checks ───────────────────────────────────────── */
.ck{display:grid;grid-template-columns:16px minmax(0,1fr);gap:9px;padding:8px 11px;
    border-bottom:1px solid var(--bg1);cursor:pointer;align-items:start}
.ck:last-child{border-bottom:none}
.ck:hover{background:var(--bg1)}
.ck-b{width:14px;height:14px;border:1px solid var(--bg4);border-radius:3px;margin-top:2px;position:relative}
.ck.on .ck-b{background:var(--green);border-color:var(--green)}
.ck.on .ck-b::after{content:'';position:absolute;left:4px;top:0;width:4px;height:8px;
  border:solid var(--bg0);border-width:0 2px 2px 0;transform:rotate(43deg)}
.ck-t{font-size:12.5px;color:var(--fg)}
.ck.on .ck-t{color:var(--grey0);text-decoration:line-through}

/* ── form ─────────────────────────────────────────── */
input,textarea{font-family:var(--mono);font-size:13px;color:var(--fg);background:var(--bg-dim);
  border:1px solid var(--bg3);border-radius:var(--r);padding:9px 11px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
textarea{min-height:150px;resize:vertical;line-height:1.6}
label{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey0);margin-bottom:6px}
.btn{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--green);color:var(--bg0);
  border:1px solid var(--green);border-radius:var(--r);padding:8px 15px;cursor:pointer;letter-spacing:.04em}
.btn:hover{background:var(--aqua);border-color:var(--aqua)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.btn.gh{background:none;color:var(--fg);border-color:var(--bg3);font-weight:500}
.btn.gh:hover{background:var(--bg1);border-color:var(--bg4);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:11px;padding:5px 10px}
.hint{font-size:11.5px;color:var(--grey0);margin-top:7px;line-height:1.5}
.saved{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);height:13px;margin-top:6px}
.errbox{border:1px solid var(--red);border-radius:var(--r);background:rgba(230,126,128,.08);
  color:var(--red);font-size:12px;padding:9px 11px;margin-top:11px;line-height:1.5}
.empty{padding:16px 12px;color:var(--grey0);font-size:12px;text-align:center;line-height:1.55}

/* ── skeleton ─────────────────────────────────────── */
.sk{background:linear-gradient(90deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg1) 100%);
    background-size:200% 100%;animation:sw 1.2s ease-in-out infinite;height:11px;border-radius:3px}
@keyframes sw{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none!important}}

.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;
      font-size:11px;color:var(--grey0)}
.kbd{border:1px solid var(--bg3);border-radius:3px;padding:1px 5px;color:var(--grey1);font-size:10.5px}
</style>

<div class="rice">
  <div class="shell">
    <div class="bar" id="bar"></div>
    <nav class="ws" id="ws" style="display:none"></nav>
    <main id="stage"></main>
  </div>
</div>

<script>
const API='https://api.sleeper.app/v1';
const ESPN='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
const SEASON='2026';
const K={league:'wr:leagueId',uid:'wr:uid',notes:'wr:notes:',checks:'wr:checks:',
         inj:'wr:injSnap',notify:'wr:notify',trade:'wr:tradeNotes'};

/* ── weekly brief: the one block Claude rewrites each week ── */
const BRIEF={ week:null, updated:'not yet written', items:[] };

const ALIAS={WAS:'WSH',WSH:'WAS',LA:'LAR',JAC:'JAX',JAX:'JAC'};
const OUT_CODES=['Out','IR','PUP','Sus','NA','DNR','COV'];

const S={view:'connect',tab:'week',loading:false,error:null,offline:false,
  week:null,leagues:[],league:null,rosterPositions:[],starters:[],
  myPlayers:[],matchup:null,games:{},scheduleOk:true,
  injChanges:[],notes:'',checks:{},tradeNotes:'',notifyState:'default'};

const CHECKS=[
  'Lineup set — every bay filled, nobody on bye',
  'Inactives checked 90 min before the early kickoffs',
  'Waiver claim in, FAAB number already decided',
  'Trending adds scanned for a starter-level replacement',
  'Next week previewed for bye holes worth solving now'
];

async function sGet(k){try{const r=await window.storage.get(k);return r?r.value:null}catch(e){return null}}
async function sSet(k,v){try{await window.storage.set(k,v);return true}catch(e){return false}}
async function api(p){const r=await fetch(API+p);if(!r.ok)throw new Error('sleeper '+r.status);return r.json()}

let PLAYERS=null;
async function loadPlayers(){
  if(PLAYERS)return PLAYERS;
  const c=await sGet('wr:players');
  if(c){try{const p=JSON.parse(c);if(p.stamp&&Date.now()-p.stamp<864e5){PLAYERS=p.map;return PLAYERS}}catch(e){}}
  const raw=await api('/players/nfl');const map={};
  for(const id in raw){const p=raw[id];
    if(!p.position||!['QB','RB','WR','TE','K','DEF'].includes(p.position))continue;
    map[id]=[p.full_name||((p.first_name||'')+' '+(p.last_name||'')).trim(),p.position,p.team||'FA',p.injury_status||''];}
  PLAYERS=map;sSet('wr:players',JSON.stringify({stamp:Date.now(),map}));return map;
}

async function loadSchedule(week){
  const games={};
  try{
    const r=await fetch(ESPN+'?dates='+SEASON+'&seasontype=2&week='+week);
    if(!r.ok)throw new Error('sched');
    const d=await r.json();
    (d.events||[]).forEach(ev=>{
      const c=(ev.competitions&&ev.competitions[0])||{};const cs=c.competitors||[];
      if(cs.length<2)return;
      const h=cs.find(x=>x.homeAway==='home')||cs[0], a=cs.find(x=>x.homeAway==='away')||cs[1];
      const ha=(h.team&&h.team.abbreviation)||'', aa=(a.team&&a.team.abbreviation)||'';
      const st=(ev.status&&ev.status.type)||{};
      const info={kick:new Date(ev.date),state:st.state||'pre',detail:st.shortDetail||''};
      games[ha]={...info,opp:aa,home:true}; games[aa]={...info,opp:ha,home:false};
    });
    S.scheduleOk=Object.keys(games).length>0;
  }catch(e){S.scheduleOk=false}
  return games;
}
const gameFor=t=>(!t||t==='FA')?null:(S.games[t]||S.games[ALIAS[t]]||null);
const onBye=t=>S.scheduleOk&&t&&t!=='FA'&&!gameFor(t);

async function boot(){
  render();
  try{const st=await api('/state/nfl');S.week=st.display_week||st.week||1}catch(e){S.offline=true}
  S.notifyState=(await sGet(K.notify))||'default';
  const saved=await sGet(K.league);
  if(saved&&!S.offline)await openLeague(saved);
  else{ if(S.offline)S.error='Cannot reach Sleeper. Your network or this preview may be blocking it — try opening the file in its own browser tab.'; render(); }
}

async function findUser(u){
  S.loading=true;S.error=null;render();
  try{
    const user=await api('/user/'+encodeURIComponent(u.trim()));
    if(!user||!user.user_id)throw new Error('no such user');
    const lg=await api('/user/'+user.user_id+'/leagues/nfl/'+SEASON);
    if(!lg.length)throw new Error('That account has no '+SEASON+' NFL leagues.');
    S.leagues=lg;S.userId=user.user_id;S.view='pick';
  }catch(e){
    S.error=/no such user|404/.test(e.message)
      ? 'No Sleeper account with that username. Use your username, not your display name.' : e.message;
  }
  S.loading=false;render();
}

async function openLeague(id){
  S.loading=true;S.error=null;S.view='board';render();
  try{
    const [lg,rosters,users,players]=await Promise.all([
      api('/league/'+id),api('/league/'+id+'/rosters'),api('/league/'+id+'/users'),loadPlayers()]);
    S.league=lg;
    S.rosterPositions=(lg.roster_positions||[]).filter(p=>!['BN','IR','TAXI'].includes(p));
    let uid=S.userId||await sGet(K.uid);
    const mine=rosters.find(r=>r.owner_id===uid)||rosters[0];
    S.myRosterId=mine?mine.roster_id:null;
    S.starters=(mine&&mine.starters)||[];
    const ord=['QB','RB','WR','TE','K','DEF'];
    S.myPlayers=((mine&&mine.players)||[]).map(pid=>{
      const d=players[pid]||['Unknown','?','',''];
      return {id:pid,n:d[0],p:d[1],t:d[2],inj:d[3]};
    }).sort((a,b)=>ord.indexOf(a.p)-ord.indexOf(b.p)||a.n.localeCompare(b.n));
    if(S.userId)sSet(K.uid,S.userId); sSet(K.league,id);

    S.games=await loadSchedule(S.week||1);

    try{
      const ms=await api('/league/'+id+'/matchups/'+(S.week||1));
      const me=ms.find(m=>m.roster_id===S.myRosterId);
      if(me){
        const op=ms.find(m=>m.matchup_id===me.matchup_id&&m.roster_id!==me.roster_id);
        const nm=rid=>{const r=rosters.find(x=>x.roster_id===rid);if(!r)return 'Opponent';
          const u=users.find(x=>x.user_id===r.owner_id);
          return (u&&((u.metadata&&u.metadata.team_name)||u.display_name))||'Opponent';};
        S.matchup={mine:me.points||0,theirs:op?(op.points||0):null,
          myName:nm(S.myRosterId),theirName:op?nm(op.roster_id):'Bye week'};
      }
    }catch(e){S.matchup=null}

    await detectInj(); await loadWeek(); startWatcher();
  }catch(e){S.error='Could not load that league: '+e.message}
  S.loading=false;render();
}

async function detectInj(){
  const raw=await sGet(K.inj); const prev=raw?JSON.parse(raw):null;
  const now={}; S.myPlayers.forEach(p=>now[p.id]=p.inj||'');
  S.injChanges=[];
  if(prev)S.myPlayers.forEach(p=>{
    const was=prev[p.id],is=p.inj||'';
    if(was!==undefined&&was!==is)
      S.injChanges.push({name:p.n,from:was||'healthy',to:is||'healthy',worse:OUT_CODES.includes(is)});
  });
  sSet(K.inj,JSON.stringify(now));
}
async function loadWeek(){
  const w=S.week||1;
  S.notes=(await sGet(K.notes+w))||'';
  const c=await sGet(K.checks+w); S.checks=c?JSON.parse(c):{};
  S.tradeNotes=(await sGet(K.trade))||'';
}

const slotLabel=s=>({SUPER_FLEX:'SFLEX',FLEX:'FLEX',REC_FLEX:'W/T',WRRB_FLEX:'W/R',DEF:'DST'}[s]||s);
function accepts(slot,pos){
  if(slot==='SUPER_FLEX')return ['QB','RB','WR','TE'].includes(pos);
  if(slot==='FLEX'||slot==='WRRB_FLEX')return ['RB','WR','TE'].includes(pos);
  if(slot==='REC_FLEX')return ['WR','TE'].includes(pos);
  return slot===pos;
}
function statusOf(p){
  if(!p)return{code:'empty',label:'',bad:true};
  if(onBye(p.t))return{code:'bye',label:'BYE',bad:true};
  if(OUT_CODES.includes(p.inj))return{code:'out',label:p.inj.toUpperCase(),bad:true};
  if(p.inj)return{code:'q',label:p.inj.slice(0,1).toUpperCase(),bad:false,warn:true};
  return{code:'ok',label:'',bad:false};
}
function buildBays(){
  const byId={};S.myPlayers.forEach(p=>byId[p.id]=p);
  const used=new Set();
  const bays=S.rosterPositions.map((slot,i)=>{
    const sid=S.starters[i];
    if(sid&&sid!=='0'&&byId[sid]&&!used.has(sid)){used.add(sid);return{slot,player:byId[sid]}}
    return{slot,player:null};
  });
  bays.forEach(b=>{ if(b.player)return;
    const pick=S.myPlayers.find(p=>!used.has(p.id)&&accepts(b.slot,p.p)&&!statusOf(p).bad)
            ||S.myPlayers.find(p=>!used.has(p.id)&&accepts(b.slot,p.p));
    if(pick){used.add(pick.id);b.player=pick}
  });
  bays.forEach(b=>b.st=statusOf(b.player));
  return {bays,bench:S.myPlayers.filter(p=>!used.has(p.id))};
}
function alerts(){
  const {bays,bench}=buildBays(); const a=[];
  bays.forEach(b=>{
    if(!b.player)a.push({l:'bad',s:'!!',t:slotLabel(b.slot)+' bay is empty',d:'Sleeper has nobody assigned. It scores zero.'});
    else if(b.st.code==='bye')a.push({l:'bad',s:'!!',t:b.player.n+' is on bye',d:'Starting in your '+slotLabel(b.slot)+' bay and does not play.'});
    else if(b.st.code==='out')a.push({l:'bad',s:'!!',t:b.player.n+' — '+b.player.inj,d:'Starting in your '+slotLabel(b.slot)+' bay. Replace before kickoff.'});
    else if(b.st.code==='q')a.push({l:'warn',s:'!',t:b.player.n+' — '+b.player.inj,d:'Check inactives about 90 min before their kickoff.'});
  });
  S.injChanges.forEach(c=>a.push({l:c.worse?'bad':'info',s:c.worse?'!!':'~',
    t:c.name+': '+c.from+' \u2192 '+c.to,d:'Changed since your last visit.'}));
  bays.filter(b=>b.st.bad).forEach(b=>{
    const fix=bench.find(p=>accepts(b.slot,p.p)&&!statusOf(p).bad&&!a.some(x=>x.fix===p.id));
    if(fix)a.push({l:'info',s:'>',fix:fix.id,t:'Swap in '+fix.n,
      d:'Healthy and playing. Fills '+slotLabel(b.slot)+' over '+(b.player?b.player.n:'an empty bay')+'.'});
  });
  return a;
}
function signals(){
  const qb=S.myPlayers.filter(p=>p.p==='QB').length;
  const need={};S.rosterPositions.forEach(s=>need[s]=(need[s]||0)+1);
  const sf=S.rosterPositions.filter(s=>s==='SUPER_FLEX').length;
  const qbSlots=(need.QB||0)+sf;
  const cnt=p=>S.myPlayers.filter(x=>x.p===p).length;
  const rb=cnt('RB'),wr=cnt('WR'),rbN=need.RB||0,wrN=need.WR||0;
  return {qbSlots,list:[
    {h:'quarterback',n:qb,cls:qb>qbSlots?'good':qb===qbSlots?'mid':'hot',
     d:qb>qbSlots?'Carrying '+qb+' for '+qbSlots+' slots. The spare is your best trade chip — hold until a rival loses a starter, not before.'
      :qb===qbSlots?'Exactly enough. One injury and a flex body starts in the superflex bay. A cheap third is worth more than a fourth receiver.'
      :'Short of '+qbSlots+' slots. Outranks every other roster decision you have.'},
    {h:'running back',n:rb,cls:rb<=rbN?'hot':rb>=rbN+3?'good':'mid',
     d:rb<=rbN?'No cushion behind the starters. One injury forces a waiver scramble.'
      :rb>=rbN+3?'Deep enough to package two mid pieces into one real starter.':'Workable depth. Nothing forced.'},
    {h:'wide receiver',n:wr,cls:wr<=wrN?'hot':wr>=wrN+3?'good':'mid',
     d:wr<=wrN?'Thin. Byes will hurt you before injuries do.'
      :wr>=wrN+3?'Surplus to convert. Two flex receivers rarely beat one starter.':'Workable depth. Nothing forced.'}
  ],hurt:S.myPlayers.filter(p=>OUT_CODES.includes(p.inj))};
}

async function enableNotifications(){
  if(!('Notification'in window)){S.notifyState='unsupported';render();return}
  try{const p=await Notification.requestPermission();S.notifyState=p;await sSet(K.notify,p)}
  catch(e){S.notifyState='blocked'}
  render();
}
let watcher=null;
function startWatcher(){
  if(watcher)clearInterval(watcher);
  const fired=new Set();
  watcher=setInterval(()=>{
    if(S.notifyState!=='granted')return;
    buildBays().bays.forEach(b=>{
      if(!b.player||!b.st.bad)return;
      const g=gameFor(b.player.t);if(!g)return;
      const m=(g.kick.getTime()-Date.now())/6e4;
      if(m>0&&m<75&&!fired.has(b.player.id)){
        fired.add(b.player.id);
        try{new Notification('Lineup problem',{body:b.player.n+' kicks off in '+Math.round(m)+' min — '+(b.st.label||'unavailable')})}catch(e){}
      }
    });
  },6e4);
}

/* ── render ── */
const stage=document.getElementById('stage'),wsEl=document.getElementById('ws'),barEl=document.getElementById('bar');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=d=>d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const dhm=d=>d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'});

function renderBar(){
  const bad=S.view==='board'&&!S.loading&&!S.error?alerts().filter(a=>a.l==='bad').length:0;
  barEl.innerHTML=`
    <div class="mod brand">war_room</div>
    ${S.league?`<div class="mod"><span class="k">league</span><span class="v">${esc(S.league.name)}</span></div>
    <div class="mod"><span class="k">teams</span><span class="v">${S.league.total_rosters||'?'}</span></div>`:''}
    ${S.week?`<div class="mod"><span class="k">wk</span><span class="v">${S.week}</span></div>`:''}
    ${S.view==='board'&&!S.loading?`<div class="mod ${bad?'warn':''}">
      <span class="${bad?'dotr':'dotg'}"></span><span class="k">${bad?bad+' to fix':'clean'}</span></div>`:''}
    <div class="mod right"><span class="${S.scheduleOk?'dotg':'dotm'}"></span><span class="k">sched</span></div>
    <div class="mod"><span class="${S.notifyState==='granted'?'dotg':'dotm'}"></span><span class="k">alerts</span></div>`;
}

function render(){
  renderBar();
  if(S.view==='connect'){wsEl.style.display='none';return renderConnect()}
  if(S.view==='pick'){wsEl.style.display='none';return renderPick()}
  if(S.loading){wsEl.style.display='none';return renderSkeleton()}
  if(S.error){wsEl.style.display='none';
    stage.innerHTML=`<div class="panel"><div class="ph"><b>error</b></div>
      <div class="pb pad"><div class="errbox">${esc(S.error)}</div>
      <button class="btn gh sm" id="rs" style="margin-top:11px">start over</button></div></div>`;
    document.getElementById('rs').onclick=()=>{S.view='connect';S.error=null;render()};return;}

  const bad=alerts().filter(a=>a.l==='bad').length;
  wsEl.style.display='flex';
  const defs=[['week','week',bad],['roster','roster'],['schedule','sched'],['trade','trade'],['notes','notes']];
  wsEl.innerHTML=defs.map(([id,l,b],i)=>
    `<button class="ws-b ${S.tab===id?'on':''}" data-tab="${id}"><span class="idx">${i+1}</span>${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
  wsEl.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});

  ({week:renderWeek,roster:renderRoster,schedule:renderSchedule,trade:renderTrade,notes:renderNotes}[S.tab]||renderWeek)();
  stage.insertAdjacentHTML('beforeend',
    `<div class="foot"><span class="kbd">1-5</span><span>switch tabs</span>
     <button class="btn gh sm" id="rf">refresh</button>
     <button class="btn gh sm" id="sw">switch league</button></div>`);
  document.getElementById('rf').onclick=()=>{const i=S.league&&S.league.league_id;if(i)openLeague(i)};
  document.getElementById('sw').onclick=async()=>{await sSet(K.league,'');S.view='connect';S.league=null;render()};
}

document.addEventListener('keydown',e=>{
  if(S.view!=='board'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const map={'1':'week','2':'roster','3':'schedule','4':'trade','5':'notes'};
  if(map[e.key]){S.tab=map[e.key];render()}
});

function playerRow(p,opts={}){
  const st=statusOf(p),g=gameFor(p.t);
  const cls=g?(g.state==='in'?'live':g.state==='post'?'done':''):(S.scheduleOk?'bye':'');
  const when=g?(g.state==='pre'?(opts.timeOnly?hhmm(g.kick):dhm(g.kick)):(g.detail||g.state)):(S.scheduleOk?'BYE':'—');
  const tag=st.code==='out'?`<i class="tag out">${esc(p.inj)}</i>`
          :st.code==='q'?`<i class="tag q">${esc(p.inj)}</i>`
          :st.code==='bye'?`<i class="tag bye">BYE</i>`:'';
  return `<div class="r ${st.bad?'dim':''}">
    <span class="r-pos ${esc(p.p)}">${esc(p.p)}</span>
    <span class="r-nm">${esc(p.n)}${tag}</span>
    <span class="r-tm">${esc(p.t||'FA')}${g?' '+(g.home?'vs':'@')+' '+esc(g.opp):''}</span>
    <span class="r-t ${cls}">${esc(when)}</span></div>`;
}

function renderWeek(){
  const {bays}=buildBays(),al=alerts(),m=S.matchup;
  const nline=S.notifyState==='granted'?'Alerts on. You get a nudge when a problem player nears kickoff, while this page is open.'
    :['denied','blocked'].includes(S.notifyState)?'Browser refused permission. The list above is doing the same job.'
    :S.notifyState==='unsupported'?'Notifications unavailable in this frame. Use the list above.'
    :'Get warned when a problem player is inside 75 minutes of kickoff. Only fires while this page is open.';

  stage.innerHTML=`
    ${m?`<div class="panel"><div class="ph acc"><b>matchup</b><span>week ${S.week}</span></div>
      <div class="score">
        <div class="sc-l"><div class="sc-nm">${esc(m.myName)}</div>
          <div class="sc-pt ${m.theirs!==null&&m.mine>m.theirs?'lead':''}">${m.mine.toFixed(1)}</div></div>
        <div class="sc-vs">VS</div>
        <div><div class="sc-nm">${esc(m.theirName)}</div>
          <div class="sc-pt ${m.theirs!==null&&m.theirs>m.mine?'lead':''}">${m.theirs===null?'—':m.theirs.toFixed(1)}</div></div>
      </div></div>`:''}

    <div class="panel"><div class="ph ${al.some(a=>a.l==='bad')?'':'acc'}"><b>needs attention</b><span class="n">${al.length}</span></div>
      <div class="pb">${al.length?al.map(a=>`<div class="al ${a.l==='warn'?'w':a.l==='info'?'i':''}">
        <div class="al-s">${esc(a.s)}</div>
        <div><div class="al-t">${esc(a.t)}</div><div class="al-d">${esc(a.d)}</div></div></div>`).join('')
        :'<div class="empty">Every bay is filled with somebody healthy who plays this week.</div>'}</div></div>

    <div class="panel"><div class="ph"><b>starting bays</b><span class="n">${bays.length}</span></div>
      <div class="tiles">${bays.map(b=>{
        const cl=!b.player?'open bad':b.st.bad?'bad':b.st.warn?'warn':b.slot==='SUPER_FLEX'?'focus':'';
        const g=b.player?gameFor(b.player.t):null;
        return `<div class="tile ${cl}">
          <div class="tile-h"><span>${esc(slotLabel(b.slot))}</span><span>${esc(b.st.label||'')}</span></div>
          <div class="tile-b"><div class="tile-nm">${b.player?esc(b.player.n):'open'}</div>
          <div class="tile-s">${b.player?esc(b.player.p+' · '+(b.player.t||'FA'))+(g?' · '+esc(hhmm(g.kick)):''):'unassigned'}</div></div>
        </div>`;}).join('')}</div></div>

    <div class="grid split">
      <div class="panel" style="margin:0"><div class="ph"><b>checklist</b><span class="n">wk ${S.week}</span></div>
        <div class="pb">${CHECKS.map((c,i)=>`<div class="ck ${S.checks[i]?'on':''}" data-i="${i}">
          <div class="ck-b"></div><div class="ck-t">${esc(c)}</div></div>`).join('')}</div></div>
      <div class="panel" style="margin:0"><div class="ph"><b>kickoff alerts</b></div>
        <div class="pb pad"><div style="font-size:12px;color:var(--grey1);line-height:1.55">${esc(nline)}</div>
        ${['granted','unsupported'].includes(S.notifyState)?'':'<button class="btn sm" id="nb" style="margin-top:11px">enable</button>'}
        </div></div>
    </div>`;

  const nb=document.getElementById('nb');if(nb)nb.onclick=enableNotifications;
  stage.querySelectorAll('.ck').forEach(el=>el.onclick=async()=>{
    const i=el.dataset.i;S.checks[i]=!S.checks[i];el.classList.toggle('on');
    await sSet(K.checks+(S.week||1),JSON.stringify(S.checks));});
}

function renderRoster(){
  const {bays,bench}=buildBays();
  const st=bays.filter(b=>b.player);
  stage.innerHTML=`
    <div class="panel"><div class="ph acc"><b>starting</b><span class="n">${st.length}</span></div>
      <div class="pb list">${st.length?st.map(b=>playerRow(b.player)).join(''):'<div class="empty">Nobody assigned.</div>'}</div></div>
    <div class="panel"><div class="ph"><b>bench</b><span class="n">${bench.length}</span></div>
      <div class="pb list">${bench.length?bench.map(p=>playerRow(p)).join(''):'<div class="empty">Bench is empty.</div>'}</div></div>`;
}

function renderSchedule(){
  const all=S.myPlayers.map(p=>({p,g:gameFor(p.t)}));
  const playing=all.filter(x=>x.g).sort((a,b)=>a.g.kick-b.g.kick);
  const byes=all.filter(x=>!x.g);
  const groups={};
  playing.forEach(x=>{
    const k=x.g.kick.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    (groups[k]=groups[k]||[]).push(x);
  });
  stage.innerHTML=`
    ${!S.scheduleOk?`<div class="panel"><div class="pb pad"><div class="errbox">
      Schedule feed unavailable this session, so kickoff times and bye detection are off. Everything else still works.
    </div></div></div>`:''}
    ${Object.entries(groups).map(([day,list])=>`
      <div class="panel"><div class="ph"><b>${esc(day.toLowerCase())}</b><span class="n">${list.length}</span></div>
        <div class="pb list">${list.map(x=>playerRow(x.p,{timeOnly:true})).join('')}</div></div>`).join('')}
    ${byes.length&&S.scheduleOk?`<div class="panel"><div class="ph"><b>on bye</b><span class="n">${byes.length}</span></div>
      <div class="pb list">${byes.map(x=>playerRow(x.p)).join('')}</div></div>`:''}
    ${!playing.length&&!byes.length?'<div class="panel"><div class="empty">No players loaded.</div></div>':''}`;
}

function renderTrade(){
  const {list,hurt}=signals();
  stage.innerHTML=`
    <div class="panel"><div class="ph"><b>positional read</b></div>
      <div class="stats">${list.map(s=>`<div class="st"><div class="st-h">${esc(s.h)}</div>
        <div class="st-n ${s.cls}">${s.n}</div><div class="st-d">${esc(s.d)}</div></div>`).join('')}</div></div>

    <div class="grid split">
      <div class="panel" style="margin:0"><div class="ph"><b>hold or move</b><span class="n">${hurt.length}</span></div>
        <div class="pb list">${hurt.length?hurt.map(p=>playerRow(p)).join('')
          :'<div class="empty">Nobody ruled out. Nothing forced.</div>'}</div>
        <div class="pb pad" style="border-top:1px solid var(--bg1)"><div class="hint" style="margin:0">
          A one or two week absence is usually a hold — the discount you would accept is steeper than the games missed.
          Multi-week absences are where selling starts to pay.</div></div></div>
      <div class="panel" style="margin:0"><div class="ph"><b>trade notes</b></div>
        <div class="pb pad"><textarea id="tn" placeholder="who you are shopping, what you would accept, which manager is desperate at QB...">${esc(S.tradeNotes)}</textarea>
        <div class="saved" id="ts"></div></div></div>
    </div>`;
  bindNote('tn','ts',v=>{S.tradeNotes=v;return sSet(K.trade,v)});
}

function renderNotes(){
  stage.innerHTML=`
    <div class="grid split">
      <div class="panel" style="margin:0"><div class="ph acc"><b>claude brief</b><span class="n">wk ${BRIEF.week||S.week}</span></div>
        <div class="pb">${BRIEF.items.length?BRIEF.items.map(i=>`<div class="al ${i.lvl==='warn'?'w':'i'}">
          <div class="al-s">${i.lvl==='warn'?'!':'~'}</div>
          <div><div class="al-t">${esc(i.t)}</div><div class="al-d">${esc(i.d)}</div></div></div>`).join('')
          :`<div class="empty">No brief yet. Ask Claude to "update me for week ${S.week}" and this fills with
             start/sit leans, waiver targets and trade reads for your actual roster.</div>`}
        </div>
        ${BRIEF.items.length?`<div class="pb pad" style="border-top:1px solid var(--bg1)">
          <div class="hint" style="margin:0">written ${esc(BRIEF.updated)}</div></div>`:''}</div>
      <div class="panel" style="margin:0"><div class="ph"><b>your notes</b><span class="n">wk ${S.week}</span></div>
        <div class="pb pad"><textarea id="nn" placeholder="leans, reminders, who you are watching...">${esc(S.notes)}</textarea>
        <div class="saved" id="ns"></div></div></div>
    </div>`;
  bindNote('nn','ns',v=>{S.notes=v;return sSet(K.notes+(S.week||1),v)});
}

function bindNote(taId,tagId,save){
  const ta=document.getElementById(taId),tag=document.getElementById(tagId);
  let t;ta.oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{
    const ok=await save(ta.value);tag.textContent=ok?'saved':'save failed';
    setTimeout(()=>tag.textContent='',1500);},600);};
}

function renderConnect(){
  stage.innerHTML=`
    <div class="grid split">
      <div class="panel" style="margin:0"><div class="ph acc"><b>connect</b></div>
        <div class="pb pad">
          <label for="u">sleeper username</label>
          <input id="u" placeholder="your_username" autocomplete="off" spellcheck="false" />
          <div class="hint">Your login username, not your display name. Read-only public API.</div>
          <button class="btn" id="go" style="margin-top:12px" ${S.loading?'disabled':''}>${S.loading?'looking...':'find my leagues'}</button>
          ${S.error?`<div class="errbox">${esc(S.error)}</div>`:''}
        </div></div>
      <div class="panel" style="margin:0"><div class="ph"><b>what it does</b></div>
        <div class="pb pad" style="font-size:12px;color:var(--grey1);line-height:1.65">
          <p style="margin-bottom:9px">Pulls your live roster and matchup from Sleeper, then checks every starting slot against the real NFL schedule.</p>
          <p style="margin-bottom:9px">Empty bays, starters on bye and anyone ruled out surface at the top instead of waiting for you to notice.</p>
          <p>Injury statuses are diffed against your last visit, so you see what moved rather than re-reading a static list.</p>
        </div></div>
    </div>`;
  const i=document.getElementById('u');
  const go=()=>i.value.trim()&&findUser(i.value);
  document.getElementById('go').onclick=go;
  i.onkeydown=e=>{if(e.key==='Enter')go()};
  i.focus();
}

function renderPick(){
  stage.innerHTML=`<div class="panel" style="max-width:560px"><div class="ph acc"><b>choose a league</b><span class="n">${S.leagues.length}</span></div>
    <div class="pb list">${S.leagues.map(l=>`
      <div class="r" data-id="${esc(l.league_id)}" style="cursor:pointer;grid-template-columns:minmax(0,1fr) auto">
        <span class="r-nm">${esc(l.name)}</span>
        <span class="r-t">${l.total_rosters}tm ${(l.roster_positions||[]).includes('SUPER_FLEX')?'SFLEX':'1QB'}</span>
      </div>`).join('')}</div></div>`;
  stage.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openLeague(b.dataset.id));
}

function renderSkeleton(){
  stage.innerHTML=`<div class="panel"><div class="ph"><b>loading</b></div>
    <div class="tiles">${Array.from({length:9},()=>`<div class="tile"><div class="tile-h"><span>&nbsp;</span></div>
      <div class="tile-b"><div class="sk" style="width:78%;height:13px;margin-bottom:6px"></div>
      <div class="sk" style="width:48%;height:9px"></div></div></div>`).join('')}</div></div>
    <div class="panel"><div class="pb list">${Array.from({length:7},()=>
      `<div class="r"><span class="sk" style="width:22px"></span><span class="sk" style="width:${45+Math.round(Math.random()*30)}%"></span>
       <span class="sk"></span><span class="sk"></span></div>`).join('')}</div></div>`;
}

boot();
</script>
