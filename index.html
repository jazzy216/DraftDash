<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --ink: #14171a;
  --paper: #e8eae5;
  --raised: #f4f5f1;
  --rule: #c6c9c0;
  --muted: #6b7069;
  --pitch: #1f4d3a;
  --flag: #b4471f;
  --amber: #8a6a12;
  --display: 'Barlow Condensed', system-ui, sans-serif;
  --body: 'Archivo', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

.wr { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px;
      line-height: 1.5; min-height: 100dvh; padding-bottom: 64px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* masthead */
.mast { border-bottom: 2px solid var(--ink); padding: 26px 0 12px;
        display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 800px) { .mast { grid-template-columns: auto 1fr auto; align-items: end; } }
.mast h1 { font-family: var(--display); font-size: 50px; font-weight: 700; letter-spacing: -0.02em;
           line-height: 0.85; text-transform: uppercase; }
.mast h1 span { display: block; color: var(--pitch); }
.mast-meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
             text-transform: uppercase; color: var(--muted); }
.mast-week { font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: 0.12em;
             text-transform: uppercase; text-align: left; }
@media (min-width: 800px) { .mast-week { text-align: right; } }
.mast-week b { display: block; font-family: var(--mono); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }

/* tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: 0.09em;
       text-transform: uppercase; padding: 13px 18px 11px; border: none; background: none;
       color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent;
       white-space: nowrap; transition: color 120ms ease; }
.tab:hover { color: var(--ink); background: none; }
.tab.on { color: var(--ink); border-bottom-color: var(--pitch); }
.tab .dot { display: inline-block; width: 6px; height: 6px; background: var(--flag);
            border-radius: 50%; vertical-align: 3px; margin-left: 6px; }

/* generic */
.eyebrow { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.16em;
           text-transform: uppercase; color: var(--muted); display: flex; align-items: center;
           gap: 10px; margin-bottom: 14px; }
.eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.sect { padding-top: 34px; }
.cols { display: grid; grid-template-columns: 1fr; gap: 36px; }
@media (min-width: 900px) { .cols { grid-template-columns: 1.3fr 1fr; gap: 48px; } }

button { font-family: var(--body); font-size: 14px; font-weight: 600; cursor: pointer;
         border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
         padding: 10px 18px; transition: transform 90ms ease, background 140ms ease; }
button:hover { background: var(--pitch); border-color: var(--pitch); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--pitch); outline-offset: 2px; }
button.ghost { background: none; color: var(--ink); }
button.ghost:hover { background: var(--ink); color: var(--paper); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.small { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; padding: 6px 11px; }

input, textarea { font-family: var(--body); font-size: 15px; color: var(--ink); background: var(--raised);
                  border: 1px solid var(--rule); padding: 10px 12px; width: 100%; }
input:focus, textarea:focus { outline: 2px solid var(--pitch); outline-offset: -1px; }
textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.field { margin-bottom: 16px; }
.help { font-size: 12.5px; color: var(--muted); margin-top: 6px; max-width: 56ch; }
.err { font-size: 13px; color: var(--flag); border-left: 3px solid var(--flag);
       padding: 8px 0 8px 12px; margin-top: 14px; background: rgba(180,71,31,0.06); }

/* scoreboard */
.score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center;
         border: 1px solid var(--rule); background: var(--raised); padding: 18px 20px; }
.score-side { min-width: 0; }
.score-side.away { text-align: right; }
.score-nm { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.1;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-pt { font-family: var(--mono); font-size: 33px; font-weight: 700; letter-spacing: -0.03em; }
.score-vs { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--muted); }

/* alerts */
.alerts { border-top: 1px solid var(--rule); }
.alert { display: grid; grid-template-columns: 4px 1fr; gap: 13px; padding: 12px 2px;
         border-bottom: 1px solid var(--rule); align-items: start; }
.alert-bar { background: var(--flag); align-self: stretch; }
.alert.warn .alert-bar { background: var(--amber); }
.alert.info .alert-bar { background: var(--pitch); }
.alert-t { font-weight: 600; font-size: 14.5px; }
.alert-d { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* bays */
.bays { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 1px;
        background: var(--rule); border: 1px solid var(--rule); }
.bay { background: var(--raised); padding: 12px 13px 14px; min-height: 100px; display: flex;
       flex-direction: column; justify-content: space-between; position: relative; }
.bay-tag { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em;
           text-transform: uppercase; color: var(--muted); }
.bay-name { font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.02; }
.bay-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.03em; margin-top: 3px; }
.bay.sflex { box-shadow: inset 0 0 0 3px var(--pitch); }
.bay.sflex .bay-tag { color: var(--pitch); }
.bay.bad { box-shadow: inset 0 0 0 3px var(--flag); }
.bay.bad .bay-tag { color: var(--flag); }
.bay.empty { background: repeating-linear-gradient(-45deg, var(--raised), var(--raised) 6px,
             var(--paper) 6px, var(--paper) 12px); }
.bay-flag { position: absolute; top: 10px; right: 11px; font-family: var(--mono); font-size: 9px;
            font-weight: 700; letter-spacing: 0.08em; color: var(--flag); border: 1px solid var(--flag);
            padding: 1px 4px; }
.bay-flag.warn { color: var(--amber); border-color: var(--amber); }

/* rows */
.rows { border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: baseline;
       padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.row-pos { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--muted); }
.row-pos.QB { color: var(--pitch); }
.row-name { font-weight: 500; }
.row-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.03em; margin-top: 2px; }
.row-right { font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align: right;
             letter-spacing: 0.04em; white-space: nowrap; }
.row-right.live { color: var(--flag); font-weight: 700; }
.row-right.done { opacity: 0.45; }
.tagpill { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
           border: 1px solid currentColor; padding: 1px 4px; margin-left: 6px; }
.t-out { color: var(--flag); }
.t-q { color: var(--amber); }
.t-bye { color: var(--flag); }

/* verdict cards */
.verdicts { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--rule);
            border: 1px solid var(--rule); }
@media (min-width: 640px) { .verdicts { grid-template-columns: repeat(3, 1fr); } }
.vc { background: var(--raised); padding: 16px 16px 18px; }
.vc-h { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.vc-n { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
.vc-n.hot { color: var(--flag); }
.vc-n.good { color: var(--pitch); }
.vc-d { font-size: 13px; color: var(--muted); }

/* schedule day groups */
.day { margin-bottom: 26px; }
.day-h { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: 0.08em;
         text-transform: uppercase; padding-bottom: 6px; border-bottom: 2px solid var(--ink); margin-bottom: 2px; }

/* checks */
.checks { border-top: 1px solid var(--rule); margin-bottom: 22px; }
.check { display: flex; gap: 11px; align-items: flex-start; padding: 10px 2px;
         border-bottom: 1px solid var(--rule); cursor: pointer; }
.check-box { width: 15px; height: 15px; border: 1.5px solid var(--ink); flex-shrink: 0;
             margin-top: 3px; position: relative; transition: background 120ms ease; }
.check.done .check-box { background: var(--pitch); border-color: var(--pitch); }
.check.done .check-box::after { content: ''; position: absolute; left: 4px; top: 0;
             width: 4px; height: 9px; border: solid var(--raised); border-width: 0 2px 2px 0;
             transform: rotate(43deg); }
.check.done .check-text { color: var(--muted); text-decoration: line-through; }
.check-text { font-size: 14px; }

.saved { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
         color: var(--pitch); margin-top: 8px; height: 14px; }

/* notify strip */
.notify { border: 1px solid var(--rule); background: var(--raised); padding: 14px 16px;
          display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notify-t { font-size: 13.5px; max-width: 52ch; }
.notify-t b { font-weight: 600; }

/* connect */
.connect { display: grid; gap: 40px; padding-top: 46px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .connect { grid-template-columns: 380px 1fr; gap: 72px; } }
.connect-aside p { color: var(--muted); font-size: 14px; margin-bottom: 13px; max-width: 46ch; }
.connect-aside strong { color: var(--ink); }
.leaguelist { border-top: 1px solid var(--rule); }
.leaguelist button { border: none; border-bottom: 1px solid var(--rule); background: none;
       color: var(--ink); text-align: left; padding: 14px 4px; display: flex;
       justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; }
.leaguelist button:hover { background: var(--raised); color: var(--ink); }
.lg-name { font-weight: 600; }
.lg-fmt { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }

/* skeleton */
.skel { background: linear-gradient(90deg, var(--rule) 0%, var(--raised) 50%, var(--rule) 100%);
        background-size: 200% 100%; animation: sweep 1.3s ease-in-out infinite; height: 13px; }
@keyframes sweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-row { padding: 12px 2px; border-bottom: 1px solid var(--rule); }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } * { transition: none !important; } }

.foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--rule); font-family: var(--mono);
        font-size: 10.5px; letter-spacing: 0.06em; color: var(--muted); display: flex; gap: 14px;
        flex-wrap: wrap; align-items: center; }
</style>

<div class="wr">
  <div class="wrap">
    <header class="mast">
      <h1>War<span>Room</span></h1>
      <div class="mast-meta" id="mastMeta">Superflex · Sleeper</div>
      <div class="mast-week" id="mastWeek">Season<b>&mdash;</b></div>
    </header>
    <nav class="tabs" id="tabs" style="display:none"></nav>
    <main id="stage"></main>
  </div>
</div>

<script>
const API = 'https://api.sleeper.app/v1';
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
const SEASON = '2026';
const K = { league:'wr:leagueId', uid:'wr:uid', notes:'wr:notes:', checks:'wr:checks:',
            inj:'wr:injSnap', notify:'wr:notify', trade:'wr:tradeNotes' };

/* ── Weekly brief ────────────────────────────────────────────────
   This is the one block that does not update itself. Ask Claude for
   a refresh each week and this gets rewritten with current reads.  */
const BRIEF = {
  week: null,
  updated: 'not yet written',
  items: []
};

const TEAM_ALIAS = { WAS:'WSH', WSH:'WAS', LA:'LAR', JAC:'JAX', JAX:'JAC' };
const OUT_CODES = ['Out','IR','PUP','Sus','NA','DNR','COV'];
const Q_CODES = ['Questionable','Doubtful','Limited Participation In Practice'];

const state = {
  view:'connect', tab:'week', loading:false, error:null, offline:false,
  week:null, leagues:[], league:null, rosterPositions:[], starters:[],
  myPlayers:[], allRosters:[], leagueUsers:[], matchup:null,
  games:{}, byeTeams:new Set(), scheduleOk:true,
  injChanges:[], notes:'', checks:{}, tradeNotes:'', notifyState:'default'
};

const CHECKS = [
  'Lineup set — every bay filled, nobody on bye',
  'Checked inactives 90 minutes before the early kickoffs',
  'Waiver claim in with the FAAB number already decided',
  'Scanned trending adds for a starter-level injury replacement',
  'Looked ahead one week for bye holes worth solving now'
];

/* storage */
async function sGet(k){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
async function sSet(k,v){ try{ await window.storage.set(k,v); return true; }catch(e){ return false; } }

async function api(p){ const r=await fetch(API+p); if(!r.ok) throw new Error('Sleeper returned '+r.status); return r.json(); }

/* player index, trimmed and cached for a day */
let PLAYERS=null;
async function loadPlayers(){
  if(PLAYERS) return PLAYERS;
  const c=await sGet('wr:players');
  if(c){ try{ const p=JSON.parse(c); if(p.stamp && Date.now()-p.stamp<86400000){ PLAYERS=p.map; return PLAYERS; } }catch(e){} }
  const raw=await api('/players/nfl'); const map={};
  for(const id in raw){ const p=raw[id];
    if(!p.position||!['QB','RB','WR','TE','K','DEF'].includes(p.position)) continue;
    map[id]=[p.full_name||((p.first_name||'')+' '+(p.last_name||'')).trim(), p.position, p.team||'FA', p.injury_status||''];
  }
  PLAYERS=map; sSet('wr:players', JSON.stringify({stamp:Date.now(), map})); return map;
}

/* NFL schedule for a week, keyed by team */
async function loadSchedule(week){
  const games={}, playing=new Set();
  try{
    const r=await fetch(ESPN+'?dates='+SEASON+'&seasontype=2&week='+week);
    if(!r.ok) throw new Error('schedule '+r.status);
    const d=await r.json();
    (d.events||[]).forEach(ev=>{
      const comp=(ev.competitions&&ev.competitions[0])||{};
      const cs=comp.competitors||[]; if(cs.length<2) return;
      const home=cs.find(c=>c.homeAway==='home')||cs[0];
      const away=cs.find(c=>c.homeAway==='away')||cs[1];
      const ha=(home.team&&home.team.abbreviation)||'', aa=(away.team&&away.team.abbreviation)||'';
      const st=(ev.status&&ev.status.type)||{};
      const info={ kick:new Date(ev.date), state:st.state||'pre', detail:st.shortDetail||'' };
      games[ha]={...info, opp:aa, home:true};
      games[aa]={...info, opp:ha, home:false};
      playing.add(ha); playing.add(aa);
    });
    state.scheduleOk=Object.keys(games).length>0;
  }catch(e){ state.scheduleOk=false; }
  return { games, playing };
}
function gameFor(team){
  if(!team||team==='FA') return null;
  return state.games[team] || state.games[TEAM_ALIAS[team]] || null;
}
function onBye(team){
  if(!state.scheduleOk||!team||team==='FA') return false;
  return !gameFor(team);
}

/* boot */
async function boot(){
  render();
  try{ const st=await api('/state/nfl'); state.week=st.display_week||st.week||1; }
  catch(e){ state.offline=true; }
  state.notifyState=(await sGet(K.notify))||'default';
  const saved=await sGet(K.league);
  if(saved && !state.offline){ await openLeague(saved); }
  else{
    if(state.offline) state.error='Could not reach Sleeper. Your network or this preview may be blocking the request — try opening the file directly in a browser tab.';
    render();
  }
}

async function findUser(username){
  state.loading=true; state.error=null; render();
  try{
    const user=await api('/user/'+encodeURIComponent(username.trim()));
    if(!user||!user.user_id) throw new Error('No Sleeper account with that username.');
    const leagues=await api('/user/'+user.user_id+'/leagues/nfl/'+SEASON);
    if(!leagues.length) throw new Error('That account has no '+SEASON+' NFL leagues.');
    state.leagues=leagues; state.userId=user.user_id; state.view='pick';
  }catch(e){
    state.error=String(e.message).includes('404')
      ? 'No Sleeper account with that username. Use your username, not your display name.' : e.message;
  }
  state.loading=false; render();
}

async function openLeague(leagueId){
  state.loading=true; state.error=null; state.view='board'; render();
  try{
    const [league, rosters, users, players]=await Promise.all([
      api('/league/'+leagueId), api('/league/'+leagueId+'/rosters'),
      api('/league/'+leagueId+'/users'), loadPlayers()
    ]);
    state.league=league; state.allRosters=rosters; state.leagueUsers=users;
    state.rosterPositions=(league.roster_positions||[]).filter(p=>!['BN','IR','TAXI'].includes(p));

    let uid=state.userId||await sGet(K.uid);
    let mine=rosters.find(r=>r.owner_id===uid)||rosters[0];
    state.myRosterId=mine?mine.roster_id:null;
    state.starters=(mine&&mine.starters)||[];
    const order=['QB','RB','WR','TE','K','DEF'];
    state.myPlayers=((mine&&mine.players)||[]).map(id=>{
      const d=players[id]||['Unknown','?','',''];
      return { id, n:d[0], p:d[1], t:d[2], inj:d[3] };
    }).sort((a,b)=>order.indexOf(a.p)-order.indexOf(b.p)||a.n.localeCompare(b.n));

    if(state.userId) sSet(K.uid, state.userId);
    sSet(K.league, leagueId);

    const sch=await loadSchedule(state.week||1);
    state.games=sch.games;

    // matchup
    try{
      const ms=await api('/league/'+leagueId+'/matchups/'+(state.week||1));
      const me=ms.find(m=>m.roster_id===state.myRosterId);
      if(me){
        const opp=ms.find(m=>m.matchup_id===me.matchup_id && m.roster_id!==me.roster_id);
        const nameFor=rid=>{
          const r=rosters.find(x=>x.roster_id===rid); if(!r) return 'Opponent';
          const u=users.find(x=>x.user_id===r.owner_id);
          return (u&&((u.metadata&&u.metadata.team_name)||u.display_name))||'Opponent';
        };
        state.matchup={ mine:me.points||0, theirs:opp?(opp.points||0):null,
                        myName:nameFor(state.myRosterId), theirName:opp?nameFor(opp.roster_id):'Bye' };
      }
    }catch(e){ state.matchup=null; }

    await detectInjuryChanges();
    await loadWeekData();
    startWatcher();
  }catch(e){ state.error='Could not load that league: '+e.message; }
  state.loading=false; render();
}

async function detectInjuryChanges(){
  const snapRaw=await sGet(K.inj);
  const prev=snapRaw?JSON.parse(snapRaw):null;
  const now={}; state.myPlayers.forEach(p=>now[p.id]=p.inj||'');
  state.injChanges=[];
  if(prev){
    state.myPlayers.forEach(p=>{
      const was=prev[p.id]; const is=p.inj||'';
      if(was!==undefined && was!==is){
        state.injChanges.push({ name:p.n, pos:p.p, from:was||'healthy', to:is||'healthy',
                                worse: OUT_CODES.includes(is) || (Q_CODES.includes(is)&&!was) });
      }
    });
  }
  sSet(K.inj, JSON.stringify(now));
}

async function loadWeekData(){
  const w=state.week||1;
  state.notes=(await sGet(K.notes+w))||'';
  const c=await sGet(K.checks+w); state.checks=c?JSON.parse(c):{};
  state.tradeNotes=(await sGet(K.trade))||'';
}

/* lineup logic */
function slotLabel(s){ return {SUPER_FLEX:'Superflex',FLEX:'Flex',REC_FLEX:'W/T Flex',
  WRRB_FLEX:'W/R Flex',DEF:'D/ST'}[s]||s; }
function slotAccepts(slot,pos){
  if(slot==='SUPER_FLEX') return ['QB','RB','WR','TE'].includes(pos);
  if(slot==='FLEX'||slot==='WRRB_FLEX') return ['RB','WR','TE'].includes(pos);
  if(slot==='REC_FLEX') return ['WR','TE'].includes(pos);
  return slot===pos;
}
function statusOf(p){
  if(!p) return { code:'empty', label:'Open', bad:true };
  if(onBye(p.t)) return { code:'bye', label:'BYE', bad:true };
  if(OUT_CODES.includes(p.inj)) return { code:'out', label:p.inj.toUpperCase(), bad:true };
  if(p.inj) return { code:'q', label:p.inj.substring(0,4).toUpperCase(), bad:false, warn:true };
  return { code:'ok', label:'', bad:false };
}
function buildBays(){
  const byId={}; state.myPlayers.forEach(p=>byId[p.id]=p);
  const used=new Set();
  const bays=state.rosterPositions.map((slot,i)=>{
    const sid=state.starters[i];
    if(sid && sid!=='0' && byId[sid] && !used.has(sid)){ used.add(sid); return {slot, player:byId[sid]}; }
    return {slot, player:null};
  });
  bays.forEach(b=>{
    if(b.player) return;
    const pick=state.myPlayers.find(p=>!used.has(p.id) && slotAccepts(b.slot,p.p) && !statusOf(p).bad)
             || state.myPlayers.find(p=>!used.has(p.id) && slotAccepts(b.slot,p.p));
    if(pick){ used.add(pick.id); b.player=pick; }
  });
  bays.forEach(b=>b.status=statusOf(b.player));
  return { bays, benched:state.myPlayers.filter(p=>!used.has(p.id)) };
}
function swapSuggestions(bays, benched){
  const out=[];
  bays.forEach(b=>{
    if(!b.status.bad) return;
    const fix=benched.find(p=>slotAccepts(b.slot,p.p) && !statusOf(p).bad && !out.some(o=>o.in.id===p.id));
    if(fix) out.push({ slot:b.slot, out:b.player, in:fix });
  });
  return out;
}

/* alerts */
function buildAlerts(){
  const {bays, benched}=buildBays();
  const a=[];
  bays.filter(b=>!b.player).forEach(b=>a.push({lvl:'bad',
    t:slotLabel(b.slot)+' bay is empty', d:'Sleeper has nobody assigned here. It scores zero.'}));
  bays.filter(b=>b.player&&b.status.code==='bye').forEach(b=>a.push({lvl:'bad',
    t:b.player.n+' is on bye', d:'Starting in your '+slotLabel(b.slot)+' bay and does not play this week.'}));
  bays.filter(b=>b.player&&b.status.code==='out').forEach(b=>a.push({lvl:'bad',
    t:b.player.n+' is '+b.player.inj, d:'Starting in your '+slotLabel(b.slot)+' bay. Replace before kickoff.'}));
  bays.filter(b=>b.player&&b.status.code==='q').forEach(b=>a.push({lvl:'warn',
    t:b.player.n+' is '+b.player.inj, d:'Check the inactive report about 90 minutes before their kickoff.'}));
  state.injChanges.forEach(c=>a.push({lvl:c.worse?'bad':'info',
    t:c.name+': '+c.from+' → '+(c.to||'healthy'), d:'Status changed since you last opened this page.'}));
  const swaps=swapSuggestions(bays,benched);
  swaps.forEach(s=>a.push({lvl:'info', t:'Swap in '+s.in.n,
    d:'Healthy and playing. Fills your '+slotLabel(s.slot)+' bay in place of '+(s.out?s.out.n:'nobody')+'.'}));
  return a;
}

/* trade signals */
function tradeSignals(){
  const teams=(state.league&&state.league.total_rosters)||12;
  const qb=state.myPlayers.filter(p=>p.p==='QB');
  const need={}; state.rosterPositions.forEach(s=>{ need[s]=(need[s]||0)+1; });
  const count=p=>state.myPlayers.filter(x=>x.p===p).length;
  const sflex=state.rosterPositions.filter(s=>s==='SUPER_FLEX').length;
  const qbSlots=(need.QB||0)+sflex;

  const sig=[];
  if(qb.length>=qbSlots+1) sig.push({h:'Quarterback',n:qb.length,cls:'good',
    d:'You carry '+qb.length+' for '+qbSlots+' slots. That spare is the most valuable trade chip on your roster once a rival loses a starter — hold it until someone is desperate, not before.'});
  else if(qb.length===qbSlots) sig.push({h:'Quarterback',n:qb.length,cls:'',
    d:'Exactly enough. One injury and you are starting a flex player in the superflex bay. A cheap third QB is worth more than a fourth receiver.'});
  else sig.push({h:'Quarterback',n:qb.length,cls:'hot',
    d:'Short of your '+qbSlots+' slots. This is the emergency and outranks every other roster decision.'});

  const rb=count('RB'), wr=count('WR');
  const rbNeed=(need.RB||0), wrNeed=(need.WR||0);
  sig.push({h:'Running back',n:rb,cls: rb<=rbNeed?'hot':(rb>=rbNeed+3?'good':''),
    d: rb<=rbNeed ? 'No cushion behind your starters. One injury forces a waiver scramble.'
      : rb>=rbNeed+3 ? 'Deep enough to package two mid pieces for one better starter.'
      : 'Reasonable depth. Nothing forced here.'});
  sig.push({h:'Wide receiver',n:wr,cls: wr<=wrNeed?'hot':(wr>=wrNeed+3?'good':''),
    d: wr<=wrNeed ? 'Thin. Bye weeks will hurt before injuries do.'
      : wr>=wrNeed+3 ? 'Surplus you can convert. Two flex receivers rarely beat one real starter.'
      : 'Reasonable depth. Nothing forced here.'});

  const hurt=state.myPlayers.filter(p=>OUT_CODES.includes(p.inj));
  return { sig, hurt, teams };
}

/* notifications */
async function enableNotifications(){
  if(!('Notification' in window)){ state.notifyState='unsupported'; render(); return; }
  try{
    const p=await Notification.requestPermission();
    state.notifyState=p; await sSet(K.notify,p);
  }catch(e){ state.notifyState='blocked'; }
  render();
}
function fire(title, body){
  if(state.notifyState!=='granted') return;
  try{ new Notification(title,{body}); }catch(e){}
}
let watcher=null;
function startWatcher(){
  if(watcher) clearInterval(watcher);
  watcher=setInterval(()=>{
    const {bays}=buildBays();
    const now=Date.now();
    bays.forEach(b=>{
      if(!b.player||!b.status.bad) return;
      const g=gameFor(b.player.t); if(!g) return;
      const mins=(g.kick.getTime()-now)/60000;
      if(mins>0 && mins<75 && !b._fired){
        b._fired=true;
        fire('Lineup problem', b.player.n+' kicks off in '+Math.round(mins)+' min and is '+(b.status.label||'unavailable')+'.');
      }
    });
  }, 60000);
}

/* render */
const stage=document.getElementById('stage');
const tabsEl=document.getElementById('tabs');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtKick=d=>d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'});

function render(){
  document.getElementById('mastWeek').innerHTML =
    state.week ? 'Regular season<b>WK '+state.week+'</b>' : 'Season<b>&mdash;</b>';
  document.getElementById('mastMeta').textContent =
    state.league ? state.league.name+' · '+(state.league.total_rosters||'?')+' teams' : 'Superflex · Sleeper';

  if(state.view==='connect'){ tabsEl.style.display='none'; return renderConnect(); }
  if(state.view==='pick'){ tabsEl.style.display='none'; return renderPick(); }
  if(state.loading){ tabsEl.style.display='none'; return renderSkeleton(); }
  if(state.error){ tabsEl.style.display='none';
    stage.innerHTML='<div class="sect"><div class="err">'+esc(state.error)+'</div>'+
      '<button class="ghost" id="rs" style="margin-top:16px">Start over</button></div>';
    document.getElementById('rs').onclick=()=>{ state.view='connect'; state.error=null; render(); };
    return;
  }

  const alertCount=buildAlerts().filter(a=>a.lvl==='bad').length;
  tabsEl.style.display='flex';
  const defs=[['week','This week',alertCount],['roster','Roster'],['schedule','Schedule'],['trade','Trade desk'],['notes','Notes']];
  tabsEl.innerHTML=defs.map(([id,label,dot])=>
    `<button class="tab ${state.tab===id?'on':''}" data-tab="${id}">${label}${dot?'<span class="dot"></span>':''}</button>`).join('');
  tabsEl.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });

  if(state.tab==='week') renderWeek();
  else if(state.tab==='roster') renderRoster();
  else if(state.tab==='schedule') renderSchedule();
  else if(state.tab==='trade') renderTrade();
  else renderNotes();
  renderFoot();
}

function renderFoot(){
  stage.insertAdjacentHTML('beforeend',
    `<div class="foot"><span>${state.scheduleOk?'Schedule live':'Schedule unavailable'}</span>
     <button class="ghost small" id="rf">Refresh</button>
     <button class="ghost small" id="sw">Switch league</button></div>`);
  document.getElementById('rf').onclick=()=>{ const id=state.league&&state.league.league_id; if(id) openLeague(id); };
  document.getElementById('sw').onclick=async()=>{ await sSet(K.league,''); state.view='connect'; state.league=null; render(); };
}

function renderWeek(){
  const {bays}=buildBays();
  const alerts=buildAlerts();
  const m=state.matchup;
  const notifyLine = state.notifyState==='granted'
    ? '<b>Alerts on.</b> While this page is open you will get a nudge when a player with a problem is about to kick off.'
    : state.notifyState==='denied' || state.notifyState==='blocked'
    ? '<b>Alerts blocked.</b> Your browser refused permission. The alert list below still works — check it before kickoff.'
    : state.notifyState==='unsupported'
    ? '<b>Alerts unavailable here.</b> This browser or frame does not allow notifications. Use the list below.'
    : '<b>Kickoff alerts.</b> Get warned when a player with a problem is close to kicking off. Only fires while this page is open.';

  stage.innerHTML=`
    ${m?`<section class="sect">
      <div class="eyebrow">Week ${state.week} matchup</div>
      <div class="score">
        <div class="score-side away"><div class="score-nm">${esc(m.myName)}</div>
          <div class="score-pt">${m.mine.toFixed(1)}</div></div>
        <div class="score-vs">VS</div>
        <div class="score-side"><div class="score-nm">${esc(m.theirName)}</div>
          <div class="score-pt">${m.theirs===null?'—':m.theirs.toFixed(1)}</div></div>
      </div>
    </section>`:''}

    <section class="sect">
      <div class="eyebrow">Needs attention</div>
      ${alerts.length?`<div class="alerts">${alerts.map(a=>`
        <div class="alert ${a.lvl==='warn'?'warn':a.lvl==='info'?'info':''}">
          <div class="alert-bar"></div>
          <div><div class="alert-t">${esc(a.t)}</div><div class="alert-d">${esc(a.d)}</div></div>
        </div>`).join('')}</div>`
        : `<div class="alerts"><div class="alert info"><div class="alert-bar"></div>
           <div><div class="alert-t">Nothing needs fixing</div>
           <div class="alert-d">Every bay is filled with somebody healthy who plays this week.</div></div></div></div>`}
      <div class="notify" style="margin-top:18px">
        <div class="notify-t">${notifyLine}</div>
        ${state.notifyState==='granted'||state.notifyState==='unsupported'?'':
          '<button id="notifyBtn" class="small">Turn on alerts</button>'}
      </div>
    </section>

    <section class="sect">
      <div class="eyebrow">Starting bays</div>
      <div class="bays">
        ${bays.map(b=>{
          const s=b.status; const g=b.player?gameFor(b.player.t):null;
          return `<div class="bay ${b.slot==='SUPER_FLEX'&&!s.bad?'sflex':''} ${s.bad?'bad':''} ${b.player?'':'empty'}">
            <div class="bay-tag">${esc(slotLabel(b.slot))}</div>
            ${s.label&&s.code!=='empty'?`<div class="bay-flag ${s.warn?'warn':''}">${esc(s.label)}</div>`:''}
            <div>
              <div class="bay-name">${b.player?esc(b.player.n):'Open'}</div>
              <div class="bay-sub">${b.player
                ? esc(b.player.p+(b.player.t?' · '+b.player.t:'')) + (g?' · '+esc(fmtKick(g.kick)):'')
                : 'nobody assigned'}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>

    <section class="sect">
      <div class="eyebrow">Week ${state.week} checklist</div>
      <div class="checks" id="checks">
        ${CHECKS.map((c,i)=>`<div class="check ${state.checks[i]?'done':''}" data-i="${i}">
          <div class="check-box"></div><div class="check-text">${esc(c)}</div></div>`).join('')}
      </div>
    </section>`;

  const nb=document.getElementById('notifyBtn'); if(nb) nb.onclick=enableNotifications;
  wireChecks();
}

function renderRoster(){
  const {bays, benched}=buildBays();
  const starters=bays.filter(b=>b.player).map(b=>b.player.id);
  const line=p=>{
    const s=statusOf(p); const g=gameFor(p.t);
    const cls = g ? (g.state==='in'?'live':g.state==='post'?'done':'') : '';
    const when = g ? (g.state==='pre'?fmtKick(g.kick):g.detail||g.state) : (state.scheduleOk?'BYE':'—');
    return `<div class="row">
      <div class="row-pos ${esc(p.p)}">${esc(p.p)}</div>
      <div><div class="row-name">${esc(p.n)}${s.code==='out'?`<span class="tagpill t-out">${esc(p.inj)}</span>`:
        s.code==='q'?`<span class="tagpill t-q">${esc(p.inj)}</span>`:
        s.code==='bye'?'<span class="tagpill t-bye">BYE</span>':''}</div>
        <div class="row-sub">${esc(p.t||'FA')}${g?' '+(g.home?'vs':'at')+' '+esc(g.opp):''}</div></div>
      <div class="row-right ${cls}">${esc(when)}</div>
    </div>`;
  };
  stage.innerHTML=`
    <section class="sect">
      <div class="eyebrow">Starting (${starters.length})</div>
      <div class="rows">${bays.filter(b=>b.player).map(b=>line(b.player)).join('')||'<div class="skel-row">Nobody assigned.</div>'}</div>
    </section>
    <section class="sect">
      <div class="eyebrow">Bench (${benched.length})</div>
      <div class="rows">${benched.map(line).join('')||'<div class="skel-row" style="color:var(--muted)">Bench is empty.</div>'}</div>
    </section>`;
}

function renderSchedule(){
  const withGames=state.myPlayers.map(p=>({p, g:gameFor(p.t)}));
  const playing=withGames.filter(x=>x.g).sort((a,b)=>a.g.kick-b.g.kick);
  const byes=withGames.filter(x=>!x.g);
  const groups={};
  playing.forEach(x=>{
    const key=x.g.kick.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    (groups[key]=groups[key]||[]).push(x);
  });
  stage.innerHTML=`
    <section class="sect">
      <div class="eyebrow">Week ${state.week} kickoffs</div>
      ${!state.scheduleOk?`<div class="err">Could not load the NFL schedule feed, so kickoff times and bye detection are unavailable this session. Everything else still works.</div>`:''}
      ${Object.keys(groups).length?Object.entries(groups).map(([day,list])=>`
        <div class="day"><div class="day-h">${esc(day)}</div>
          <div class="rows">${list.map(({p,g})=>`
            <div class="row">
              <div class="row-pos ${esc(p.p)}">${esc(p.p)}</div>
              <div><div class="row-name">${esc(p.n)}${p.inj?`<span class="tagpill ${OUT_CODES.includes(p.inj)?'t-out':'t-q'}">${esc(p.inj)}</span>`:''}</div>
                <div class="row-sub">${esc(p.t)} ${g.home?'vs':'at'} ${esc(g.opp)}</div></div>
              <div class="row-right ${g.state==='in'?'live':g.state==='post'?'done':''}">
                ${esc(g.state==='pre'?g.kick.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):(g.detail||g.state))}
              </div>
            </div>`).join('')}</div>
        </div>`).join(''):''}
      ${byes.length&&state.scheduleOk?`
        <div class="day"><div class="day-h">On bye</div>
          <div class="rows">${byes.map(({p})=>`
            <div class="row"><div class="row-pos ${esc(p.p)}">${esc(p.p)}</div>
              <div class="row-name">${esc(p.n)}</div>
              <div class="row-right">${esc(p.t||'FA')}</div></div>`).join('')}</div>
        </div>`:''}
    </section>`;
}

function renderTrade(){
  const {sig, hurt}=tradeSignals();
  stage.innerHTML=`
    <section class="sect">
      <div class="eyebrow">Positional read</div>
      <div class="verdicts">
        ${sig.map(s=>`<div class="vc"><div class="vc-h">${esc(s.h)}</div>
          <div class="vc-n ${s.cls}">${s.n}</div><div class="vc-d">${esc(s.d)}</div></div>`).join('')}
      </div>
      <div class="help" style="margin-top:12px">Counts come from your live roster. The read is about roster shape, not player value — for who specifically to move, ask Claude for a weekly refresh.</div>
    </section>

    <section class="sect cols">
      <div>
        <div class="eyebrow">Hold or move</div>
        ${hurt.length?`<div class="rows">${hurt.map(p=>`
          <div class="row"><div class="row-pos ${esc(p.p)}">${esc(p.p)}</div>
            <div><div class="row-name">${esc(p.n)}<span class="tagpill t-out">${esc(p.inj)}</span></div>
              <div class="row-sub">Decide: stash through it, or sell before the market prices it in</div></div>
            <div class="row-right">${esc(p.t||'')}</div></div>`).join('')}</div>`
          : `<div class="rows"><div class="skel-row" style="color:var(--muted)">Nobody on your roster is currently ruled out. Nothing forced.</div></div>`}
        <div class="help" style="margin-top:12px">A player who is out for one or two weeks is usually a hold — the discount you would accept is steeper than the games you would miss. Multi-week absences are where selling starts to make sense.</div>
      </div>
      <div>
        <div class="eyebrow">Trade notes</div>
        <textarea id="tnotes" placeholder="Who you are shopping, what you would accept, which manager is desperate at QB…">${esc(state.tradeNotes)}</textarea>
        <div class="saved" id="tsaved"></div>
      </div>
    </section>`;
  const ta=document.getElementById('tnotes'), tag=document.getElementById('tsaved');
  let t; ta.oninput=()=>{ clearTimeout(t); t=setTimeout(async()=>{
    state.tradeNotes=ta.value; const ok=await sSet(K.trade,ta.value);
    tag.textContent=ok?'Saved':'Could not save'; setTimeout(()=>tag.textContent='',1600); },600); };
}

function renderNotes(){
  stage.innerHTML=`
    <section class="sect cols">
      <div>
        <div class="eyebrow">Claude's week ${BRIEF.week||state.week} brief</div>
        ${BRIEF.items.length?`<div class="alerts">${BRIEF.items.map(i=>`
          <div class="alert ${i.lvl==='warn'?'warn':'info'}"><div class="alert-bar"></div>
          <div><div class="alert-t">${esc(i.t)}</div><div class="alert-d">${esc(i.d)}</div></div></div>`).join('')}</div>
          <div class="help" style="margin-top:10px">Last written: ${esc(BRIEF.updated)}</div>`
          : `<div class="rows"><div class="skel-row" style="color:var(--muted)">
             No brief written yet. Ask Claude to "update me for week ${state.week}" and this fills with
             start/sit leans, waiver targets and trade reads for your actual roster.</div></div>`}
      </div>
      <div>
        <div class="eyebrow">Your week ${state.week} notes</div>
        <textarea id="notes" placeholder="Leans, reminders, who you are watching…">${esc(state.notes)}</textarea>
        <div class="saved" id="nsaved"></div>
      </div>
    </section>`;
  const ta=document.getElementById('notes'), tag=document.getElementById('nsaved');
  let t; ta.oninput=()=>{ clearTimeout(t); t=setTimeout(async()=>{
    state.notes=ta.value; const ok=await sSet(K.notes+(state.week||1),ta.value);
    tag.textContent=ok?'Saved':'Could not save'; setTimeout(()=>tag.textContent='',1600); },600); };
}

function wireChecks(){
  stage.querySelectorAll('.check').forEach(el=>{
    el.onclick=async()=>{ const i=el.dataset.i; state.checks[i]=!state.checks[i];
      el.classList.toggle('done'); await sSet(K.checks+(state.week||1),JSON.stringify(state.checks)); };
  });
}

function renderConnect(){
  stage.innerHTML=`
    <div class="connect">
      <div>
        <div class="eyebrow">Connect</div>
        <div class="field"><label for="u">Sleeper username</label>
          <input id="u" placeholder="your_username" autocomplete="off" />
          <div class="help">Your login username, not your display name.</div></div>
        <button id="go" ${state.loading?'disabled':''}>${state.loading?'Looking…':'Find my leagues'}</button>
        ${state.error?`<div class="err">${esc(state.error)}</div>`:''}
      </div>
      <div class="connect-aside">
        <div class="eyebrow">In season</div>
        <p>Pulls your <strong>live roster and matchup</strong> from Sleeper, then checks every starting bay against the real NFL schedule.</p>
        <p>Anything broken — an empty bay, a starter on bye, somebody ruled out — surfaces at the top of the week view instead of waiting for you to notice.</p>
        <p>Injury status changes are <strong>diffed against your last visit</strong>, so you see what moved rather than a static list.</p>
      </div>
    </div>`;
  const i=document.getElementById('u');
  const go=()=>i.value.trim()&&findUser(i.value);
  document.getElementById('go').onclick=go;
  i.onkeydown=e=>{ if(e.key==='Enter') go(); };
  i.focus();
}

function renderPick(){
  stage.innerHTML=`<div class="sect" style="max-width:620px">
    <div class="eyebrow">Choose a league</div>
    <div class="leaguelist">${state.leagues.map(l=>`
      <button data-id="${esc(l.league_id)}"><span class="lg-name">${esc(l.name)}</span>
      <span class="lg-fmt">${l.total_rosters} tm · ${(l.roster_positions||[]).includes('SUPER_FLEX')?'Superflex':'1QB'}</span>
      </button>`).join('')}</div></div>`;
  stage.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openLeague(b.dataset.id));
}

function renderSkeleton(){
  stage.innerHTML=`<section class="sect"><div class="eyebrow">Loading your team</div>
    <div class="bays">${Array.from({length:9},()=>`<div class="bay">
      <div class="skel" style="width:34%;height:9px"></div>
      <div><div class="skel" style="width:74%;height:17px;margin-bottom:6px"></div>
      <div class="skel" style="width:46%;height:9px"></div></div></div>`).join('')}</div>
    <div class="sect"><div class="rows">${Array.from({length:6},()=>
      `<div class="skel-row"><div class="skel" style="width:${40+Math.round(Math.random()*35)}%"></div></div>`).join('')}</div></div>
  </section>`;
}

boot();
</script>
